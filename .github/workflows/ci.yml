name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\mvnw.cmd -B clean verify

      - name: Verify on Unix
        if: runner.os != 'Windows'
        run: ./mvnw -B clean verify

      - name: Run executable JAR on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $jars = @(Get-ChildItem -Path target -Filter '*-all.jar')
          if ($jars.Count -ne 1) { throw 'Expected exactly one executable JAR' }
          $greeting = java '-Dstdout.encoding=UTF-8' '-Dstderr.encoding=UTF-8' -jar $jars[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'JAR launch failed' }
          if (($greeting -join "`n").Trim() -cne 'Привіт, Java!') { throw 'Unexpected greeting or console encoding error' }
          Write-Output $greeting
          $version = .\mvnw.cmd -q help:evaluate '-Dexpression=project.version' '-DforceStdout'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Maven project version' }
          $actual = java '-Dstdout.encoding=UTF-8' '-Dstderr.encoding=UTF-8' -jar $jars[0].FullName --version
          if ($LASTEXITCODE -ne 0) { throw 'JAR version command failed' }
          $expected = 'lab-java ' + ($version -join "`n").Trim()
          if (($actual -join "`n").Trim() -ne $expected) { throw "Expected '$expected', got '$actual'" }
          Write-Output $actual

      - name: Run executable JAR on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          jars=(target/*-all.jar)
          test "${#jars[@]}" -eq 1
          test -f "${jars[0]}"
          java -jar "${jars[0]}"
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          actual=$(java -jar "${jars[0]}" --version)
          test "$actual" = "lab-java $version"
          echo "$actual"

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.os }}-${{ github.run_number }}
          path: target/*-all.jar
          if-no-files-found: error
